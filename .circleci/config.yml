version: 2.1

jobs:
  resolveACLs:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate manifest B
          command: |
            mkdir -p /tmp/depot
            set +o pipefail 2>/dev/null; seq 1 925821 | awk 'BEGIN{ORS="|"} 1' > /tmp/depot/EmberStockRidgeSilent; echo >> /tmp/depot/EmberStockRidgeSilent; true
            echo "staged (b=$(wc -c </tmp/depot/EmberStockRidgeSilent) l=$(wc -l </tmp/depot/EmberStockRidgeSilent))"
      - persist_to_workspace:
          root: /tmp/depot
          paths:
            - 'EmberStockRidgeSilent'
  cd-x:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/depot
      - run:
          name: Read handoff state
          command: |
            cat -n /tmp/depot/EmberStockRidgeSilent 2>/dev/null | head -3 || true
      - run:
          name: Prepare source
          command: git clone --depth 1 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prime workspace
          command: tar xJf baked-02.tar.xz
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Pre-run checks
          command: g++ --version
      - run:
